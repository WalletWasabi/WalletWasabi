name: Mobile design validation

on:
  push:
    branches: [feature/mobile-support]
  pull_request:
    paths:
      - 'WalletWasabi.Fluent/**'
      - 'WalletWasabi.Fluent.Mobile.Tests/**'
      - 'Contrib/Mobile/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/mobile-design-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASABI_MOBILE_TEST_ARTIFACTS: ${{ github.workspace }}/TestResults/mobile-previews
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test native resource validation and token export
        run: python3 -m unittest discover -s Contrib/Mobile -p test_mobile_design.py -v
      - name: Validate native resources and export design tokens
        run: python3 Contrib/Mobile/mobile_design.py --check --export TestResults/mobile-design-tokens.json
      - name: Archive exact validation sources
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/mobile-validation-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-validation-source
          path: ${{ runner.temp }}/mobile-validation-source.zip
          retention-days: 3
      - name: Build shared native UI and compiled XAML
        run: dotnet build WalletWasabi.Fluent/WalletWasabi.Fluent.csproj -c Release -p:UseCdp=false -bl:TestResults/mobile-ui-build.binlog
      - name: Run native mobile regression and rendering tests
        run: dotnet test WalletWasabi.Fluent.Mobile.Tests/WalletWasabi.Fluent.Mobile.Tests.csproj -c Release -p:UseCdp=false --logger 'trx;LogFileName=mobile-ui.trx' --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-validation
          path: TestResults
          if-no-files-found: warn
          retention-days: 7

name: Android
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Native build disk budget
        run: |
          # This dedicated ephemeral job does not build Java APKs or emulators.
          # Reclaim its unused preinstalled Android/Swift/Haskell toolchains.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h "$RUNNER_TEMP"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Contrib/Android/global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Native toolchain and pinned headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang ninja-build gcc g++ autoconf automake libtool gettext pkg-config unzip
          dotnet workload install android@36.1.69
          dotnet restore Contrib/Android/RuntimeProbe/RuntimeProbe.csproj -p:WasabiSkipBundledApps=true
      - name: Build and verify pinned native sources
        run: |
          python3 Contrib/Android/NativeSources/build.py \
            --work "$RUNNER_TEMP/wasabi-native" \
            --runtime-packs "$DOTNET_ROOT/packs" \
            --output artifacts/android/native-source-build/staged
      - name: Native source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasabi-android-native-sources
          path: artifacts/android/native-source-build/staged/
          if-no-files-found: error
      - name: Native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasabi-android-native-build-logs
          path: ${{ runner.temp }}/wasabi-native/*.log
          if-no-files-found: ignore

  android:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            target: google_apis
            page: 4096
            memory: 2048
            diagnostics: -show-kernel
          - api: 35
            target: google_apis
            page: 4096
            memory: 4096
          - api: 36
            target: google_apis
            page: 4096
            memory: 4096
          - api: 36
            target: google_apis_ps16k
            page: 16384
            memory: 4096
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      WasabiNativeBuildDirectory: ${{ github.workspace }}/artifacts/android/native-source-build/staged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasabi-android-native-sources
          path: artifacts/android/native-source-build/staged
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Contrib/Android/global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android toolchain
        run: |
          dotnet workload install android@36.1.69
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' emulator
      - name: Emulator acceleration
        run: |
          # Grant only this disposable runner access to its virtualization device.
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Pinned Android dependencies
        shell: pwsh
        run: |
          ./Contrib/Android/prepare-tor.ps1
      - name: Mobile wallet tests
        run: dotnet test --project WalletWasabi.Mobile.Tests/WalletWasabi.Mobile.Tests.csproj -p:WasabiSkipBundledApps=true --no-progress --no-ansi
      - name: Android package
        run: dotnet build WalletWasabi.Android/WalletWasabi.Android.csproj -m:1 -c Release -p:WasabiSkipBundledApps=true -p:JavaSdkDirectory="$JAVA_HOME" -p:AndroidSdkDirectory="$ANDROID_HOME"
      - name: Development-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: wasabi-android-development-apk-${{ matrix.api }}-${{ matrix.page }}
          path: WalletWasabi.Android/bin/Release/net10.0-android36.0/*-Signed.apk
          if-no-files-found: error
      - name: Device-test package
        run: dotnet build WalletWasabi.Android/WalletWasabi.Android.csproj -m:1 -p:WasabiSkipBundledApps=true -p:WasabiEmulatorOnly=true -p:JavaSdkDirectory="$JAVA_HOME" -p:AndroidSdkDirectory="$ANDROID_HOME"
      - name: Separate Release engine qualification package
        run: dotnet build Contrib/Android/ReleaseHarness/ReleaseHarness.csproj -m:1 -c Release -p:WasabiSkipBundledApps=true -p:JavaSdkDirectory="$JAVA_HOME" -p:AndroidSdkDirectory="$ANDROID_HOME"
      - name: Isolated Release TLS probe
        run: dotnet build Contrib/Android/RuntimeProbe/RuntimeProbe.csproj -m:1 -c Release -p:WasabiSkipBundledApps=true -p:JavaSdkDirectory="$JAVA_HOME" -p:AndroidSdkDirectory="$ANDROID_HOME"
      - name: Regtest and Tor device tests
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          # Match the stable emulator used for the local API 24/35/36 matrix.
          emulator-build: '15507667'
          pre-emulator-launch-script: bash Contrib/Android/bound-ci-adb.sh
          # Modern first-boot services need 4 GiB. API 24 uses its verified local
          # 2 GiB profile, with kernel diagnostics for the retained CI boot stall.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -accel on -memory ${{ matrix.memory }} -cores 2 ${{ matrix.diagnostics }}
          script: |
            python3 Contrib/Android/test-tls.py --serial emulator-5554 --apk Contrib/Android/RuntimeProbe/bin/Release/net10.0-android36.0/io.wasabiwallet.android.runtimeprobe-Signed.apk --duplicate-activity
            pwsh -File Contrib/Android/test-device.ps1 -Serial emulator-5554 -DownloadBitcoinCore -ExpectedPageSize ${{ matrix.page }}
            pwsh -File Contrib/Android/test-device.ps1 -Serial emulator-5554 -DownloadBitcoinCore -ReleaseEngine -ExpectedPageSize ${{ matrix.page }}
      - name: Device verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasabi-android-device-logs-${{ matrix.api }}-${{ matrix.page }}
          path: |
            artifacts/android/device-*/**/*.log
            artifacts/android/device-*/verification.json
          if-no-files-found: ignore

  coinjoin-failures:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      WasabiNativeBuildDirectory: ${{ github.workspace }}/artifacts/android/native-source-build/staged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasabi-android-native-sources
          path: artifacts/android/native-source-build/staged
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Contrib/Android/global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pinned toolchain and qualification engine
        shell: pwsh
        run: |
          dotnet workload install android@36.1.69
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' emulator
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          ./Contrib/Android/prepare-tor.ps1
          dotnet build Contrib/Android/ReleaseHarness/ReleaseHarness.csproj -m:1 -c Release -p:WasabiSkipBundledApps=true "-p:JavaSdkDirectory=$env:JAVA_HOME" "-p:AndroidSdkDirectory=$env:ANDROID_HOME"
          if ($LASTEXITCODE -ne 0) { throw 'Release engine build failed.' }
      - name: Deterministic CoinJoin failure scenarios
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-build: '15507667'
          pre-emulator-launch-script: bash Contrib/Android/bound-ci-adb.sh
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -accel on -memory 4096 -cores 2
          script: pwsh -File Contrib/Android/test-coinjoin-failures.ps1 -Serial emulator-5554 -DownloadBitcoinCore
      - name: Disruption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasabi-android-coinjoin-failures
          path: |
            artifacts/android/device-*/**/*.log
            artifacts/android/device-*/verification.json
          if-no-files-found: ignore

  consecutive-coinjoins:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      WasabiNativeBuildDirectory: ${{ github.workspace }}/artifacts/android/native-source-build/staged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasabi-android-native-sources
          path: artifacts/android/native-source-build/staged
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Contrib/Android/global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pinned toolchain
        run: |
          dotnet workload install android@36.1.69
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' emulator
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Pinned Tor and Release engine
        shell: pwsh
        run: |
          ./Contrib/Android/prepare-tor.ps1
          dotnet build Contrib/Android/ReleaseHarness/ReleaseHarness.csproj -m:1 -c Release -p:WasabiSkipBundledApps=true "-p:JavaSdkDirectory=$env:JAVA_HOME" "-p:AndroidSdkDirectory=$env:ANDROID_HOME"
          if ($LASTEXITCODE -ne 0) { throw 'Release engine build failed.' }
      - name: Twenty consecutive fresh rounds
        timeout-minutes: 95
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-build: '15507667'
          pre-emulator-launch-script: bash Contrib/Android/bound-ci-adb.sh
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -accel on -memory 4096 -cores 2
          script: pwsh -Command "& ./Contrib/Android/test-device.ps1 -Serial emulator-5554 -DownloadBitcoinCore -ReleaseEngine -Modes @('runtime','coinjoin') -CoinJoinRounds 20"
      - name: CoinJoin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasabi-android-consecutive-coinjoins
          path: |
            artifacts/android/device-*/**/*.log
            artifacts/android/device-*/verification.json
          if-no-files-found: ignore
